version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    AWS_ACCOUNT_ID: "YOUR_AWS_ACCOUNT_ID"
    IMAGE_REPO_NAME: "kata-backend"
    ENVIRONMENT: "production"

phases:
  pre_build:
    commands:
      - echo "=== Pre-Build Phase - Production Environment ==="
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=prod-${COMMIT_HASH:=latest}
      - echo "Image will be tagged as $IMAGE_TAG"
      
  build:
    commands:
      - echo "=== Build Phase ==="
      - echo "Build started on `date`"
      - echo "Building the Docker image..."
      - docker build -t $REPOSITORY_URI:latest -t $REPOSITORY_URI:$IMAGE_TAG -t $REPOSITORY_URI:prod-latest .
      - echo "Docker image built successfully"
      
  post_build:
    commands:
      - echo "=== Post-Build Phase ==="
      - echo "Build completed on `date`"
      - echo "Pushing the Docker images..."
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:prod-latest
      - echo "Docker images pushed successfully"
      - echo "Writing image definitions file..."
      - printf '[{"name":"kata-backend","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - echo "Updating task definition with new image..."
      - sed -i.bak "s|\${image_url}|$REPOSITORY_URI:$IMAGE_TAG|g" task-definition.json
      - rm -f task-definition.json.bak
      - cat task-definition.json
      - echo "Deployment artifacts created successfully"

artifacts:
  files:
    - imagedefinitions.json
    - task-definition.json

cache:
  paths:
    - '/root/.npm/**/*'
