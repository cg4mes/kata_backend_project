name: Deploy QA
on:
  push:
    branches: [qa]

jobs:
  deploy:
    name: Deploy QA
    uses: bancodebogota/bbog-can-pipeline/.github/workflows/deploy_nodejs_lambda.yml@v1
    with:
      version: $(node -p "require('./package.json').version")
      aws-region: us-east-1
      delete-versions: false
      load-secrets-environment: true
      description-for-version: $(node -p "require('./package.json').version")
      path-environments-variables: >
        pipeline/qa-env.json
        pipeline/stg-env.json
        pipeline/prod-env.json
      function-name: 'kata-backend-qa'
      files-to-compress: 'node_modules dist package.json'
      function-handler: dist/lambda.handler
      function-memory-size: 512
      node-version: 20.x
      function-runtime: nodejs20.x
      path-to-env-vars: pipeline/qa-env.json
      environment: qa
    secrets:
      DIG_READER_GITHUB_ACCESS_TOKEN: ${{ secrets.DIG_READER_GITHUB_ACCESS_TOKEN }}
      ARTIFACTORY_READER_USER: ${{ secrets.ARTIFACTORY_READER_USER }}
      ARTIFACTORY_READER_API_KEY: ${{ secrets.ARTIFACTORY_READER_API_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE_DEPLOY_BACKEND: ${{ secrets.AWS_ROLE_DEPLOY_BACKEND }}
