name: Deploy Backend to QA (Lambda)

on:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'package*.json'
      - 'buildspec-lambda-qa.yml'
      - '.github/workflows/deploy-qa.yml'

env:
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION_NAME: kata-backend-qa
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy to QA Lambda
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: npm ci --only=production

      - name: Build TypeScript
        run: npm run build

      - name: Create Lambda deployment package
        run: |
          cd dist
          cp -r ../node_modules .
          zip -r ../lambda-deployment-qa.zip . -x "*.spec.js" "*.spec.d.ts" "test/*"
          cd ..
          ls -lh lambda-deployment-qa.zip

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda-deployment-qa.zip \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Backend deployed successfully to QA Lambda"
          echo "Function: ${{ env.LAMBDA_FUNCTION_NAME }}"
          echo "Region: ${{ env.AWS_REGION }}"
