version: 0.2

# BuildSpec for Lambda deployment - Staging Environment
env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    ENVIRONMENT: "staging"
    FUNCTION_NAME: "kata-backend-staging"

phases:
  pre_build:
    commands:
      - echo "=== Pre-Build Phase - Staging Lambda Deployment ==="
      - echo "Build started on `date`"
      - node --version
      - npm --version
      
  build:
    commands:
      - echo "=== Build Phase ==="
      - echo "Installing dependencies..."
      - npm ci --only=production
      - echo "Building TypeScript application..."
      - npm run build
      - echo "Build completed successfully"
      
  post_build:
    commands:
      - echo "=== Post-Build Phase ==="
      - echo "Preparing Lambda deployment package..."
      - cd dist
      - echo "Copying node_modules to dist..."
      - cp -r ../node_modules .
      - echo "Creating deployment package..."
      - zip -r ../lambda-deployment-staging.zip . -x "*.spec.js" "*.spec.d.ts" "test/*"
      - cd ..
      - echo "Deployment package size:"
      - du -h lambda-deployment-staging.zip
      - echo "Updating Lambda function for Staging..."
      - |
        aws lambda update-function-code \
          --function-name $FUNCTION_NAME \
          --zip-file fileb://lambda-deployment-staging.zip \
          --region $AWS_DEFAULT_REGION
      - echo "Waiting for Lambda function update to complete..."
      - |
        aws lambda wait function-updated \
          --function-name $FUNCTION_NAME \
          --region $AWS_DEFAULT_REGION
      - echo "Lambda function updated successfully"
      - echo "Deployment completed on `date`"

artifacts:
  files:
    - lambda-deployment-staging.zip
  name: LambdaDeploymentPackageStaging

cache:
  paths:
    - 'node_modules/**/*'
